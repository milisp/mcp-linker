version: 2
updates:
  # Keeps the pinned action SHAs current: one grouped PR per month, merged
  # by hand. Package version updates are left off on purpose; for vulnerable
  # bun/cargo dependencies, enable Dependabot security updates in the repo
  # settings instead.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Skip releases younger than a week, so a hijacked tag has time to be
    # caught before it is proposed here.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
